name: Deploy
on:
    workflow_dispatch:
    push:
        branches:
            - main
jobs:
    merge-artifacts:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Use Node.js 22.14.0
              uses: actions/setup-node@v4
              with:
                  node-version: "22.14.0"

            - name: Build and Deploy
              run: |
                npm run predeploy
                npm run deploy

            

